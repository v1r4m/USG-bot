services:
  hayangi:
    build: .
    container_name: hayangi
    env_file: .env
    # 봇이 비정상 종료되면 자동으로 다시 시작합니다.
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
    # CTFd 연동 정보(토큰 포함)를 컨테이너를 다시 만들어도 유지합니다.
    volumes:
      - hayangi-data:/app/data

volumes:
  hayangi-data:
